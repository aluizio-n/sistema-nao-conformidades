<app-navbar />
<div class="max-w-2xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
  <div class="mb-6 sm:mb-8">
    <button (click)="cancelar()" class="text-sm text-slate-400 hover:text-slate-600 font-medium mb-2 flex items-center gap-1 transition-colors cursor-pointer">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      Voltar
    </button>
    <h2 class="text-lg sm:text-xl font-bold text-slate-800">Abrir Nova NC</h2>
    <p class="text-sm text-slate-400 mt-0.5">Registre o desvio encontrado</p>
  </div>

  @if (erro()) {
    <div class="bg-red-50 border border-red-200 text-red-600 px-3 py-2.5 rounded-md mb-4 text-sm flex items-center gap-2 animate-fade-in">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      {{ erro() }}
    </div>
  }

  <form (ngSubmit)="salvar()" class="bg-white rounded-lg border border-slate-200 p-5 sm:p-7 space-y-5">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5">Título <span class="text-red-500">*</span></label>
      <input type="text" [(ngModel)]="nc.titulo" name="titulo" required
             class="w-full px-3 py-2.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400 outline-none transition-colors"
             placeholder="Resumo curto da não conformidade" />
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1.5">Descrição <span class="text-red-500">*</span></label>
      <textarea [(ngModel)]="nc.descricao" name="descricao" required rows="4"
                class="w-full px-3 py-2.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-400 outline-none transition-colors resize-none"
                placeholder="Descrição detalhada do desvio observado"></textarea>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Tipo <span class="text-red-500">*</span></label>
        <select [(ngModel)]="nc.tipo" name="tipo" required
                class="w-full px-3 py-2.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none transition-colors text-slate-600">
          <option value="produto">Produto</option>
          <option value="processo">Processo</option>
          <option value="material">Material</option>
          <option value="seguranca">Segurança</option>
          <option value="outro">Outro</option>
        </select>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Gravidade <span class="text-red-500">*</span></label>
        <select [(ngModel)]="nc.gravidade" name="gravidade" required
                class="w-full px-3 py-2.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none transition-colors text-slate-600">
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
          <option value="critica">Crítica</option>
        </select>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Linha / Processo <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="nc.linha_processo" name="linha_processo" required
               class="w-full px-3 py-2.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none transition-colors"
               placeholder="Ex: Linha A3" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1.5">Setor <span class="text-red-500">*</span></label>
        <input type="text" [(ngModel)]="nc.setor" name="setor" required
               class="w-full px-3 py-2.5 border border-slate-300 rounded-md text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none transition-colors"
               placeholder="Ex: Montagem" />
      </div>
    </div>

    <div class="flex flex-col-reverse sm:flex-row gap-3 pt-4 border-t border-slate-100">
      <button type="button" (click)="cancelar()"
              class="border border-slate-300 text-slate-600 px-5 py-2.5 rounded-md text-sm font-medium hover:bg-slate-50 transition-colors w-full sm:w-auto cursor-pointer">
        Cancelar
      </button>
      <button type="submit" [disabled]="salvando()"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-md text-sm font-medium transition-colors disabled:opacity-50 w-full sm:w-auto flex items-center justify-center gap-2 cursor-pointer disabled:cursor-not-allowed">
        @if (salvando()) {
          <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          Salvando...
        } @else {
          Abrir NC
        }
      </button>
    </div>
  </form>
</div>
